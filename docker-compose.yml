services:
  api:
    build: ./api
    env_file: .env
    environment:
      DB_PATH: /data/app.db
      MEDIA_DIR: /data/media
      OUT_DIR_CONTAINER: /out
      # instacreator's ElasticMQ, published on the host at 24104. Empty
      # disables the handoff and /api/recreate/{sc}/submit answers 503.
      SQS_ENDPOINT: ${SQS_ENDPOINT:-http://host.docker.internal:24104}
      SQS_QUEUE: recreate-jobs
      RESYNC_INTERVAL_HOURS: ${RESYNC_INTERVAL_HOURS:-24}
      RESYNC_CHECK_SECONDS: ${RESYNC_CHECK_SECONDS:-300}
      RESYNC_DAILY_AT: ${RESYNC_DAILY_AT-06:00}
      RESYNC_TZ: ${RESYNC_TZ:-Asia/Kolkata}
    volumes:
      - ./data:/data
      - ${OUT_DIR:-./downloads}:/out
    restart: unless-stopped

  web:
    build: ./web
    environment:
      API_ORIGIN: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./web:/srv
      - /srv/node_modules
      # .next must not be shared with the host: a native `next dev` and the
      # container's would write the same build directory and fight over it.
      - /srv/.next
    depends_on:
      - api
    restart: unless-stopped
